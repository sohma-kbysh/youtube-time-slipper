<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YouTube Time Slipper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="panel__header">
        <h1 class="panel__title">YouTube Time Slipper</h1>
      </header>

      <section class="field">
        <label class="switch">
          <input type="checkbox" id="enabled" />
          <span class="switch__label" data-i18n="popup.enabled"></span>
        </label>
      </section>

      <section class="field">
        <label class="field__label" for="virtual-date" data-i18n="popup.virtualPresent"></label>
        <div class="field__row">
          <input type="date" id="virtual-date" min="2005-02-14" />
          <button type="button" id="today" class="button button--ghost" data-i18n="popup.today"></button>
        </div>
        <p class="field__hint" id="virtual-date-summary"></p>
        <p class="field__error" id="virtual-date-error" data-i18n="popup.invalidDate" hidden></p>
      </section>

      <section class="field">
        <label class="field__label" for="range-start" data-i18n="popup.rangeStart"></label>
        <div class="field__row">
          <input type="date" id="range-start" min="2005-02-14" />
          <button type="button" id="range-clear" class="button button--ghost" data-i18n="popup.rangeClear"></button>
        </div>
        <p class="field__hint" data-i18n="popup.rangeStartHint"></p>
      </section>

      <section class="field">
        <span class="field__label" data-i18n="popup.unknownDates"></span>
        <div class="field__row field__row--radios">
          <label class="radio">
            <input type="radio" name="unknown" value="hide" />
            <span data-i18n="popup.hide"></span>
          </label>
          <label class="radio">
            <input type="radio" name="unknown" value="show" />
            <span data-i18n="popup.show"></span>
          </label>
        </div>
        <p class="field__hint" data-i18n="popup.unknownHint"></p>
      </section>

      <section class="field">
        <label class="switch">
          <input type="checkbox" id="fill-feed" />
          <span class="switch__label" data-i18n="popup.fillFeed"></span>
        </label>
        <p class="field__hint" data-i18n="popup.fillFeedHint"></p>

        <div class="field__row field__row--numbers">
          <label class="number">
            <span class="number__label" data-i18n="popup.fillTarget"></span>
            <input type="number" id="fill-target" min="5" max="200" step="1" />
          </label>
          <label class="number">
            <span class="number__label" data-i18n="popup.fillRounds"></span>
            <input type="number" id="fill-rounds" min="1" max="300" step="1" />
          </label>
        </div>
        <p class="field__hint" data-i18n="popup.fillCost"></p>
      </section>

      <section class="field">
        <label class="switch">
          <input type="checkbox" id="discover-era" />
          <span class="switch__label" data-i18n="popup.discover"></span>
        </label>
        <p class="field__hint" data-i18n="popup.discoverHint"></p>
      </section>

      <details class="field">
        <summary class="field__summary" data-i18n="popup.features"></summary>
        <label class="switch switch--indented">
          <input type="checkbox" id="hide-future-features" />
          <span class="switch__label" data-i18n="popup.hideFutureFeatures"></span>
        </label>
        <p class="field__hint" data-i18n="popup.featuresHint"></p>
        <div class="checks checks--single" id="features"></div>
      </details>

      <details class="field">
        <summary class="field__summary" data-i18n="popup.surfaces"></summary>
        <div class="checks" id="surfaces"></div>
      </details>

      <section class="field">
        <label class="switch">
          <input type="checkbox" id="badge" />
          <span class="switch__label" data-i18n="popup.showBadge"></span>
        </label>
      </section>

      <section class="field">
        <label class="field__label" for="language" data-i18n="popup.language"></label>
        <select id="language" class="select"></select>
      </section>

      <footer class="panel__footer">
        <p class="status" id="status" role="status"></p>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
